<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DynaPuff:wght@400..700&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
    <title>Sign Up Form</title>
    <link rel="stylesheet" href="form_style.css">
</head>
<body>
    <div class = "background-image">
        <div class = "logo-section">

        </div>
        <div class  = "form-container">
            <h1>  This is not a real online service!<br>You know you need something like this in your life to help you realize your deepest dreams. Sign up <em>now</em> to get started.</br></h1>
            <div class = "form-box">
                <form>
                    <h1>Sign Up</h1>
                    <label for = "first-name">First Name</label>
                    <input type = "text" id = "first-name" name = "first-name" placeholder = "ex: John" required>
                    <label for = "last-name">Last Name</label>
                    <input type = "text" id = "last-name" name = "last-name" placeholder = "ex: Doe" required>
                </form>
            </div>
        </div>
        
    </div>
    
</body>
